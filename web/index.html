<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Elona Shooter by Noa and the Elona Shooter Plus contributors. A free, unofficial browser port made with AI." />
    <title>Elona Shooter Plus — Unofficial Browser Port</title>
  </head>
  <body>
    <main>
      <div id="game" aria-label="Elona Shooter game">
        <div id="game-controls">
          <button id="fullscreen" aria-label="Enter fullscreen" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5" /></svg>
          </button>
          <button id="mute" aria-label="Unmute" aria-pressed="true" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-5v16l-5-5H4z" /><path class="sound-waves" d="M17 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" /><path class="sound-muted" d="m17 9 5 6m0-6-5 6" /></svg>
          </button>
        </div>
        <div id="load-status" role="status">Loading original game assets…</div>
        <input id="save-file" type="file" accept=".json,.sol,application/json,application/octet-stream" hidden />
        <p id="save-status" class="screen-reader-only" role="status"></p>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
