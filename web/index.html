<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Elona Shooter Plus PLUS — a faithful browser port in progress." />
    <title>Elona Shooter Plus PLUS</title>
  </head>
  <body>
    <main>
      <div id="game" aria-label="Elona Shooter game">
        <div id="load-status" role="status">Loading original game assets…</div>
        <nav id="game-tools" aria-label="Game options"><button id="fullscreen">Full screen</button><button id="export-save">Export save</button><button id="import-save" disabled>Import save</button><button id="sound">Sound: muted</button></nav>
        <input id="save-file" type="file" accept=".json,application/json" hidden />
        <p id="save-status" role="status" hidden></p>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
